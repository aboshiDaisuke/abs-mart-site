<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ページが見つかりません｜ABS Mart</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#102b40" />
  <link rel="icon" href="/favicon-christmas.svg?v=1" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&amp;family=M+PLUS+Rounded+1c:wght@500;800&amp;display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(120% 80% at 50% 0%, #1d4a5c 0%, #102b40 60%, #0b1f2f 100%);
      color: #fffef7;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
      font-weight: 500;
      text-align: center;
    }
    main { max-width: 520px; }
    .logo { display: inline-block; }
    .logo img { width: 200px; height: auto; display: block; }
    .code {
      margin: 28px 0 0;
      font-family: "Cherry Bomb One", "M PLUS Rounded 1c", sans-serif;
      font-size: clamp(72px, 20vw, 120px);
      line-height: 1;
      color: #eb3652;
      text-shadow: 0 6px 0 #8f1830;
      letter-spacing: 0.04em;
    }
    h1 { margin: 20px 0 0; font-size: clamp(22px, 5.6vw, 28px); font-weight: 800; color: #ffe18a; }
    p.lead { margin: 14px 0 0; font-size: 16px; line-height: 1.8; color: #e7f1ec; }
    p.lead span { display: inline-block; }
    .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 52px; padding: 0 26px;
      border-radius: 999px;
      font-size: 16px; font-weight: 800; text-decoration: none;
      transition: transform .15s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:focus-visible { outline: 3px solid #ffe18a; outline-offset: 3px; }
    .btn-primary { background: #ca2343; color: #fff; border: 3px solid #fffef7; box-shadow: 0 5px 0 #8f1830; }
    .btn-ghost { background: transparent; color: #fffef7; border: 2px solid rgba(255, 254, 247, .55); }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/" aria-label="ABS Mart トップへ">
      <img src="/abs_mart_logo_toyland.svg" alt="ABS Mart" width="280" height="76" />
    </a>
    <p class="code" aria-hidden="true">404</p>
    <h1>ページが見つかりませんでした</h1>
    <p class="lead"><span>アドレスがまちがっているか、</span><span>ページが移動・終了したのかも。</span><br /><span>トップから探してみてね。</span></p>
    <div class="actions">
      <a class="btn btn-primary" href="/">トップへ戻る</a>
      <a class="btn btn-ghost" href="/#works">ゲーム＆ツールを見る</a>
    </div>
  </main>
</body>
</html>
